global
    maxconn 10000
    nbthread 1

defaults
    mode http
    timeout connect 1s
    timeout client 10s
    timeout server 10s

frontend proxy
    bind *:9999
    default_backend api_servers

backend api_servers
    balance roundrobin
    server api1 api1:8080 check inter 2s fall 5 rise 1
    server api2 api2:8080 check inter 2s fall 5 rise 1
