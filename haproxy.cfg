global
    maxconn 20000
    nbthread 1

defaults
    mode http
    maxconn 20000
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend rinha_front
    bind *:9999
    default_backend rinha_api

backend rinha_api
    balance roundrobin
    http-reuse always
    server api1 unix@/sockets/api1.sock maxconn 10000
    server api2 unix@/sockets/api2.sock maxconn 10000
