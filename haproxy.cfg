global
    maxconn 4096
    nbthread 1

defaults
    mode http
    timeout connect 2s
    timeout client 3s
    timeout server 3s
    timeout http-request 3s

frontend proxy
    bind *:9999
    default_backend api_servers

backend api_servers
    balance roundrobin
    option httpchk GET /ready
    http-check expect status 200
    server api1 api1:8080 check inter 2s
    server api2 api2:8080 check inter 2s
