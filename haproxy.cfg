global
    maxconn 10000
    nbthread 1

defaults
    mode http
    option http-keep-alive
    timeout connect 1s
    timeout client 30s
    timeout server 30s
    timeout http-keep-alive 30s

frontend proxy
    bind *:9999
    default_backend api_servers

backend api_servers
    balance roundrobin
    http-reuse always
    server api1 api1:8080 check inter 2s fall 5 rise 1 maxconn 500
    server api2 api2:8080 check inter 2s fall 5 rise 1 maxconn 500
