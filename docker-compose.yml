services:
  lb:
    image: haproxy:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - rinha-sockets:/sockets
    depends_on:
      - api1
      - api2
    networks:
      rinha-net:
        aliases:
          - lb
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "32MB"

  api1:
    image: ghcr.io/luiziwasaki/rinha-2026-luiz:latest
    environment:
      - UDS_PATH=/sockets/api1.sock
      - DATA_DIR=/data
    volumes:
      - rinha-sockets:/sockets
    networks:
      - rinha-net
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165MB"

  api2:
    image: ghcr.io/luiziwasaki/rinha-2026-luiz:latest
    environment:
      - UDS_PATH=/sockets/api2.sock
      - DATA_DIR=/data
    volumes:
      - rinha-sockets:/sockets
    networks:
      - rinha-net
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165MB"

networks:
  rinha-net:
    driver: bridge

volumes:
  rinha-sockets:
