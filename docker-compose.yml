version: '3.8'

services:
  lb:
    image: haproxy:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - sockets-volume:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "50MB"
    depends_on:
      - api1
      - api2
    networks:
      - rinha-network

  api1:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SOCKET_PATH=/sockets/api1.sock
      - DATA_DIR=/data
    volumes:
      - sockets-volume:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "150MB"
    networks:
      - rinha-network

  api2:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SOCKET_PATH=/sockets/api2.sock
      - DATA_DIR=/data
    volumes:
      - sockets-volume:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "150MB"
    networks:
      - rinha-network

volumes:
  sockets-volume:

networks:
  rinha-network:
    driver: bridge
